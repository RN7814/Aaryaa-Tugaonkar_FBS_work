spring.application.name=nexaanova-crm
spring.config.import=optional:file:.local/local.properties
server.address=${APP_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/nexaanova_task3?serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:nexaa_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+05:30'
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=never
app.admin-email=${ADMIN_EMAIL:admin@nexaanova.local}
app.admin-password=${ADMIN_PASSWORD:}
app.sample-data=false
app.sample-password=${SAMPLE_PASSWORD:}
