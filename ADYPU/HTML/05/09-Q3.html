<!DOCTYPE html>
<html>
<head>
    <title>Audio and Video Player</title>
</head>
<body>

    <h1>HTML5 Multimedia</h1>

    <h2>1. Audio Player</h2>
    <audio controls>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <h2>2. Video Player</h2>
    <video width="320" height="240" controls>
        <source src="https://w3schools.com" type="video/mp4">
    </video>

</body>
</html>
